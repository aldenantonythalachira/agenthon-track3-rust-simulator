[package]
name = "rust_sim"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "53"
parquet = "53"
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
